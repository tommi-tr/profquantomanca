  if(!S.st){if(S.anc=='end'){r.end=S.end;r.dur=Math.max(0,S.end-s)}else{r.dur=S.dur;r.end=s+S.dur}r.rem=r.dur}
  else if(S.pa){r.rem=Math.max(0,S.rem);r.end=t+r.rem;r.dur=r.end-s}
  else{r.end=S.end;r.dur=S.end-s;r.wait=t<s;r.rem=r.wait?r.dur:S.end-t}
  r.fin=S.st&&!S.pa&&!r.wait&&r.rem<=0;return r}
function pad(n){return(n<10?'0':'')+n}
function hm(ms){var d=new Date(ms);return d.getHours()+':'+pad(d.getMinutes())}
function fr(ms){var s=Math.ceil(ms/1000);if(s<0)s=0;var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+pad(m)+':'+pad(x):pad(m)+':'+pad(x)}
function fd(ms){var m=Math.round(ms/M),h=Math.floor(m/60);return h?h+' h '+pad(m%60)+' min':m+' min'}
function txt(id,v){var e=$(id);if(e.textContent!==v)e.textContent=v}

var bg=$('bg');
function bgu(){var k=now()/M,P=Math.PI*2;
  var h1=255+60*Math.sin(k*P/45),h2=h1+60+30*Math.sin(k*P/70),h3=h1-70;
  var x1=25+15*Math.sin(k*P/37),y1=30+15*Math.cos(k*P/41),x2=75+15*Math.cos(k*P/53),y2=70+12*Math.sin(k*P/47),x3=60+25*Math.sin(k*P/61),y3=15+10*Math.cos(k*P/59);
  function f(n){return Math.round(n*10)/10}
  bg.style.background='radial-gradient(ellipse at '+f(x1)+'% '+f(y1)+'%,hsla('+f(h1)+',65%,30%,.55),rgba(4,5,10,0) 60%),radial-gradient(ellipse at '+f(x2)+'% '+f(y2)+'%,hsla('+f(h2)+',60%,26%,.5),rgba(4,5,10,0) 55%),radial-gradient(ellipse at '+f(x3)+'% '+f(y3)+'%,hsla('+f(h3)+',60%,24%,.4),rgba(4,5,10,0) 50%),#04050a'}

function cls(id,c){var e=$(id);if(e.className!==c)e.className=c}
function render(){var t=now(),r=calc(t);
  txt('vNow',hm(t));txt('vStart',hm(r.start));txt('vEnd',hm(r.end));txt('vDur',fd(r.dur));
  $('hStart').style.visibility=(!S.st&&!S.sFix)?'visible':'hidden';
  var v=$('vRem'),b=$('bar');
  if(r.fin){var mg=msg||defMsg(),L=mg.length+20*(mg.split('\n').length-1),fs=L<=12?9:L<=24?6.5:L<=48?5:4;
    txt('vRem',mg);v.style.fontSize=fs+'em';v.style.whiteSpace='pre-wrap';v.style.lineHeight='1.15';v.style.maxWidth=Math.round($('stack').clientWidth*0.96)+'px';
    v.style.color='#fff';b.style.backgroundColor='#fff';txt('lRem',tr('timeUp'));b.style.width='0%'}
  else{var s=fr(r.rem);txt('vRem',s);v.style.fontSize=(s.length>5?'11em':'14em');v.style.whiteSpace='nowrap';v.style.lineHeight='';v.style.maxWidth='';
    var w=S.st&&!r.wait&&r.rem<=5*M,c=w?'#ffc061':'#fff';v.style.color=c;b.style.backgroundColor=c;
    txt('lRem',S.pa?tr('paused'):(r.wait?tr('startsAt')+hm(r.start):tr('rem')));
    var p=S.st&&!r.wait&&r.dur>0?Math.max(0,Math.min(1,r.rem/r.dur)):1;b.style.width=(Math.round(p*1000)/10)+'%'}
  v.style.opacity=S.pa?'.55':'1';
  cls('bPlay','sb'+(S.st&&!S.pa&&!r.fin?' act':''));
  cls('bPause','sb'+(S.pa?' act':''));
  cls('bNotes','sb'+(nO?' act':''));}
function saveS(){store(KEY,JSON.stringify({S:S,n:nO,col:col,msg:msg,lang:lang}));}

function reset(silent){S.st=false;S.pa=false;S.sFix=false;S.anc='dur';S.dur=S.dur0;if(!silent){saveS();render()}}
$('bPlay').onclick=function(){var t=now(),r=calc(t);if(r.fin)return;
  if(!S.st){var st=S.sFix?S.start:t;if(S.anc=='end'){if(S.end<=st)return}else S.end=st+S.dur;S.start=st;S.st=true;S.pa=false;wake()}
  else if(S.pa){S.end=t+Math.max(0,S.rem);S.pa=false}
  saveS();render()};
$('bPause').onclick=function(){var t=now(),r=calc(t);if(!S.st||S.pa||r.fin||r.wait)return;S.rem=S.end-t;S.pa=true;saveS();render()};
$('bReset').onclick=function(){reset(false)};

function apply(f,val){var t=now(),r=calc(t);
  if(f=='start'){
    if(!S.st){if(S.anc=='end'&&S.end<=val)return tr('errBefore');S.sFix=true;S.start=val}
    else{var d=r.dur;S.start=val;if(S.pa)S.rem=val+d-t;else S.end=val+d}}
  else if(f=='end'){if(val<=r.start)return tr('errAfter');
    if(!S.st){S.anc='end';S.end=val}else if(S.pa)S.rem=val-t;else S.end=val}
  else if(f=='dur'){if(!S.st){S.anc='dur';S.dur=S.dur0=val}else if(S.pa)S.rem=r.start+val-t;else S.end=r.start+val}
  else if(f=='rem'){if(!S.st){S.anc='dur';S.dur=S.dur0=val}else if(S.pa)S.rem=val;else S.end=r.wait?r.start+val:t+val}
  saveS();render();return null}
function near(h,m,ref){var d=new Date(ref);d.setHours(h,m,0,0);var v=d.getTime();if(v-ref>12*H)v-=24*H;else if(ref-v>12*H)v+=24*H;return v}

/* tastierino */
var kf,km,kb,kfr,kph;
var T={start:'kStart',end:'kEnd',dur:'kDur',rem:'kRem'};
var kp=$('kp'),kov=$('kov'),mp=$('mp'),lp=null;
function kE(m){$('kE').textContent=m}
function kd(){var d=$('kD');d.style.opacity='1';
  if(km=='time'){if(!kb){d.textContent=kph;d.style.opacity='.4';return}var s=('----'+kb).slice(-4);s=s.slice(0,2)+':'+s.slice(2);d.textContent=s.replace(/^-+/,'')}
  else d.textContent=(kb||'0')+' min'}
function kopen(f,el){var r=calc(now());kf=f;km=(f=='start'||f=='end')?'time':'min';kE('');
  $('kT').textContent=tr(T[f]);
  if(km=='time'){kb='';kph=hm(r[f])}else{kb=String(Math.max(1,Math.round((f=='dur'?r.dur:r.rem)/M)));kfr=true}
  $('kQ').style.display=km=='min'?'':'none';kd();
  kp.style.display='block';kov.style.display='block';
  var er=el.getBoundingClientRect(),W=window.innerWidth,Hh=window.innerHeight,kw=kp.offsetWidth,kh=kp.offsetHeight,g=2*em;
  var x=er.right+g;if(x+kw>W-g)x=er.left-kw-g;if(x<g)x=g;
  var y=er.top+er.height/2-kh/2;y=Math.max(g,Math.min(Hh-kh-g,y));
  kp.style.left=x+'px';kp.style.top=y+'px'}
function kclose(){kp.style.display='none';if((!mp||mp.style.display!='block')&&(!lp||lp.style.display!='block'))kov.style.display='none'}
(function(){var rows=[['1','2','3'],['4','5','6'],['7','8','9'],['C','0','⌫']],g=$('kG');
  for(var i=0;i<rows.length;i++){var row=document.createElement('div');row.className='krow';
    for(var j=0;j<3;j++){(function(k){var b=document.createElement('button');b.className='k';b.innerHTML='<span>'+k+'</span>';
      b.onclick=function(){kE('');if(k=='C')kb='';else if(k=='⌫')kb=kb.slice(0,-1);else{if(km=='min'&&kfr){kb='';kfr=false}if(kb.length<(km=='time'?4:3))kb+=k}kd()};
      row.appendChild(b)})(rows[i][j])}
    g.appendChild(row)}
  var q=$('kQ').getElementsByTagName('button');
  for(var n=0;n<q.length;n++)(function(b){b.onclick=function(){var v=Math.max(1,(parseInt(kb,10)||0)+parseInt(b.getAttribute('data-q'),10));kb=String(Math.min(600,v));kfr=true;kE('');kd()}})(q[n]);
})();
$('kNo').onclick=kclose;kov.onclick=function(){kclose();mclose();lclose()};
/* messaggio di fine */
var mta=$('mta');
function mopen(){kclose();mta.value=msg||defMsg();mp.style.display='block';kov.style.display='block';
  mp.style.left=Math.max(0,Math.round((window.innerWidth-mp.offsetWidth)/2))+'px';mp.style.top=Math.max(0,Math.round((window.innerHeight-mp.offsetHeight)/2))+'px';
  try{mta.focus();mta.setSelectionRange(mta.value.length,mta.value.length)}catch(e){}}
function mclose(){mp.style.display='none';kov.style.display='none';try{mta.blur()}catch(e){}}
$('bMsg').onclick=function(){if(mp.style.display=='block')mclose();else mopen()};
$('mNo').onclick=mclose;
$('mDef').onclick=function(){mta.value=defMsg();try{mta.focus()}catch(e){}};
$('mOk').onclick=function(){var v=mta.value.replace(/\r/g,'').replace(/^\s+|\s+$/g,'').replace(/\n{3,}/g,'\n\n');msg=(v&&v!==defMsg())?v:'';saveS();mclose();render()};
$('kOk').onclick=function(){var val,t=now();
  if(km=='time'){if(kb.length<3){kE(tr('errFmt'));return}var n=parseInt(kb,10),h=Math.floor(n/100),m=n%100;
    if(h>23||m>59){kE(tr('errBad'));return}
    val=near(h,m,kf=='end'?calc(t).start:t)}
  else{var v=parseInt(kb,10);if(!v){kE(tr('errMin'));return}val=v*M}
  var e=apply(kf,val);if(e)kE(e);else kclose()};
$('vStart').onclick=function(){kopen('start',this)};$('vEnd').onclick=function(){kopen('end',this)};
$('vDur').onclick=function(){kopen('dur',this)};$('vRem').onclick=function(){kopen('rem',this)};

/* note */
var nO=false,cv=$('cv'),ctx=cv.getContext('2d'),ta=$('ta'),mode='pen',col='#ffffff',dr=false,lx=0,ly=0,dpr=window.devicePixelRatio||1,ink=null,inkT=null;
var u=load(KEY+'.ink');if(u){ink=new Image();ink.onload=function(){if(nO)fit()};ink.src=u}
ta.value=load(KEY+'.txt')||'';
function fit(){var r=$('nar').getBoundingClientRect();if(r.width<20||r.height<20)return;
  var w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);
  if(cv.width!==w||cv.height!==h){var tmp=document.createElement('canvas');tmp.width=cv.width||1;tmp.height=cv.height||1;
    tmp.getContext('2d').drawImage(cv,0,0);cv.width=w;cv.height=h;ctx.drawImage(tmp,0,0)}
  if(ink&&ink.complete&&ink.naturalWidth){ctx.drawImage(ink,0,0);ink=null}}
function tog(o){nO=o;$('notes').className='notes'+(o?' open':'');setTimeout(fit,350);saveS();render()}
$('bNotes').onclick=function(){tog(!nO)};$('tCls').onclick=function(){tog(false)};
function setMode(m){mode=m;$('tPen').className='tb'+(m=='pen'?' on':'');$('tTxt').className='tb'+(m=='txt'?' on':'');$('tEr').className='tb'+(m=='er'?' on':'');
  ta.style.pointerEvents=m=='txt'?'auto':'none';if(m=='txt')ta.focus();else ta.blur()}
$('tPen').onclick=function(){setMode('pen')};$('tTxt').onclick=function(){setMode('txt')};$('tEr').onclick=function(){setMode('er')};
var dots=document.querySelectorAll('.dot');
function setCol(c){col=c;ta.style.color=c;for(var i=0;i<dots.length;i++)dots[i].className='dot'+(dots[i].getAttribute('data-c')==c?' on':'')}
for(var i=0;i<dots.length;i++)(function(d){d.onclick=function(){setCol(d.getAttribute('data-c'));if(mode=='er')setMode('pen');saveS()}})(dots[i]);
$('tClr').onclick=function(){ctx.clearRect(0,0,cv.width,cv.height);ta.value='';store(KEY+'.ink',null);store(KEY+'.txt',null)};
ta.oninput=function(){store(KEY+'.txt',ta.value)};
function saveInk(){clearTimeout(inkT);inkT=setTimeout(function(){try{store(KEY+'.ink',cv.toDataURL('image/png'))}catch(e){}},600)}
function xy(cx,cy){var r=cv.getBoundingClientRect();return[(cx-r.left)*dpr,(cy-r.top)*dpr]}
function seg(x,y){ctx.globalCompositeOperation=mode=='er'?'destination-out':'source-over';ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.lineWidth=mode=='er'?cv.height*0.05:Math.max(2,cv.height*0.006);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();lx=x;ly=y}
function dn(cx,cy){if(mode=='txt')return;dr=true;var p=xy(cx,cy);lx=p[0]+0.1;ly=p[1];seg(p[0],p[1])}
function mv(cx,cy){if(!dr)return;var p=xy(cx,cy);seg(p[0],p[1])}
function up(){if(dr){dr=false;saveInk()}}
if(window.PointerEvent){
  cv.addEventListener('pointerdown',function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}dn(e.clientX,e.clientY)});
  cv.addEventListener('pointermove',function(e){mv(e.clientX,e.clientY)});
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
}else{
  cv.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];dn(t.clientX,t.clientY)});
  cv.addEventListener('touchmove',function(e){e.preventDefault();var t=e.touches[0];mv(t.clientX,t.clientY)});
  cv.addEventListener('touchend',up);
  cv.addEventListener('mousedown',function(e){dn(e.clientX,e.clientY)});
  window.addEventListener('mousemove',function(e){mv(e.clientX,e.clientY)});
  window.addEventListener('mouseup',up);
}

/* schermo intero */
var de=document.documentElement,rq=de.requestFullscreen||de.webkitRequestFullscreen||de.mozRequestFullScreen||de.msRequestFullscreen;
function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement)}
function exFs(){var f=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen;if(f)f.call(document)}
var fsOk=!!rq&&document.fullscreenEnabled!==false&&document.webkitFullscreenEnabled!==false;
var tT=null;function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tT);tT=setTimeout(function(){t.style.display='none'},4500)}
function fsLab(){$('lFull').textContent=isFs()?tr('exit'):tr('full');sideW()}

$('bFull').onclick=function(){if(!fsOk){toast(tr('fsMsg'));return}try{if(isFs())exFs();else{var p=rq.call(de);if(p&&p['catch'])p['catch'](function(){toast(tr('fsMsg'))})}}catch(e){toast(tr('fsMsg'))}};
document.addEventListener('fullscreenchange',fsLab);document.addEventListener('webkitfullscreenchange',fsLab);fsLab();

/* schermo sempre acceso, se il browser lo consente */
var wl=null;function wake(){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})})['catch'](function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.st)wake()});

/* allinea larghezza pulsanti laterali */
function sideW(){var ids=['sideL','sideR'];for(var i=0;i<ids.length;i++){var s=$(ids[i]);s.style.width='';}
  var w=Math.max($('sideL').offsetWidth,$('sideR').offsetWidth);$('sideL').style.width=w+'px';$('sideR').style.width=w+'px'}

function applyLang(){var i,e,a=document.querySelectorAll('[data-i]');for(i=0;i<a.length;i++){e=a[i];e.textContent=tr(e.getAttribute('data-i'))}
  a=document.querySelectorAll('[data-it]');for(i=0;i<a.length;i++){e=a[i];e.title=tr(e.getAttribute('data-it'));e.setAttribute('aria-label',e.title)}
  a=document.querySelectorAll('[data-ip]');for(i=0;i<a.length;i++){e=a[i];e.placeholder=tr(e.getAttribute('data-ip'))}
  mta.placeholder=defMsg();document.documentElement.lang=lang=='fano'?'it':lang;fsLab();render()}
lp=$('lp');
(function(){for(var i=0;i<LANGS.length;i++)(function(c){var b=document.createElement('button');b.textContent=c[1];b.setAttribute('data-l',c[0]);
  b.onclick=function(){lang=c[0];saveS();lclose();applyLang()};lp.appendChild(b)})(LANGS[i])})();
function lopen(){kclose();mclose();var bs=lp.getElementsByTagName('button');for(var i=0;i<bs.length;i++)bs[i].className=bs[i].getAttribute('data-l')==lang?'on':'';
  lp.style.display='block';kov.style.display='block';var br=$('bLang').getBoundingClientRect();
  lp.style.left=Math.max(0,Math.round(br.right-lp.offsetWidth))+'px';lp.style.top=Math.max(0,Math.round(br.top-lp.offsetHeight-em))+'px';$('bLang').className='ib act'}
function lclose(){lp.style.display='none';kov.style.display='none';$('bLang').className='ib'}
$('bLang').onclick=function(){if(lp.style.display=='block')lclose();else lopen()};
window.addEventListener('resize',function(){scale();sideW();if(nO)fit();kclose();lclose();render()});
if(saved){if(saved.col)setCol(saved.col);if(saved.n)tog(true)}
applyLang();sideW();bgu();render();
setInterval(render,250);setInterval(bgu,2000);
if(S.st)wake();
})();
</script>
